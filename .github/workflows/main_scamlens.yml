name: Build and deploy ScamLens to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload application files
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/**
            !.github/**
            !.venv/**
            !antenv/**

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download application files
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: 15cd8e66-d1db-4a7a-8d74-199f62017566
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_11672E1C838D4AFBB04CBB004846BE52 }}
          subscription-id: ea8c6a5e-9d3e-424d-b4e2-15c203ae3395

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: scamlens
          slot-name: Production
          package: .
